<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>N2 文法 Quiz — 全26課</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;--correct:#00b894;--wrong:#d63031;--text:#eee;--muted:#999;
--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-top:calc(56px + var(--safe-top));padding-bottom:var(--safe-bot);-webkit-text-size-adjust:100%}
#topbar{position:fixed;top:0;left:0;right:0;height:calc(56px + var(--safe-top));padding-top:var(--safe-top);background:var(--surface);border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px;z-index:20}
#topbar .title{font-size:15px;font-weight:700;color:var(--accent)}
#topbar .stats{font-size:13px;color:var(--muted)}
#topbar .gear{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:8px;-webkit-tap-highlight-color:transparent}
#progress-bar-bg{position:fixed;top:calc(56px + var(--safe-top));left:0;right:0;height:4px;background:#333;z-index:19}
#progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),#ff6b6b);transition:width .3s;width:0%}
#main{max-width:600px;margin:0 auto;padding:16px}
#quiz-area{margin-top:8px}
.grammar-badge{display:inline-block;background:var(--card);border:1px solid var(--accent);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:12px;margin-bottom:8px}
.section-badge{display:inline-block;background:#333;color:var(--muted);padding:3px 8px;border-radius:12px;font-size:11px;margin-left:6px}
#question-text{font-size:19px;line-height:1.7;margin:12px 0 20px;padding:16px;background:var(--surface);border-radius:12px;border-left:4px solid var(--accent);word-break:break-word}
#question-text .blank{border-bottom:2px solid var(--accent);padding:0 16px;margin:0 2px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{padding:14px 16px;border:2px solid #444;border-radius:12px;background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent;min-height:48px}
.choice-btn:active{transform:scale(.98)}
.choice-btn .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--card);font-size:13px;font-weight:700;flex-shrink:0}
.choice-btn.correct{border-color:var(--correct);background:rgba(0,184,148,.15)}
.choice-btn.correct .num{background:var(--correct);color:#fff}
.choice-btn.wrong{border-color:var(--wrong);background:rgba(214,48,49,.15)}
.choice-btn.wrong .num{background:var(--wrong);color:#fff}
.choice-btn.reveal-correct{border-color:var(--correct);opacity:.7}
#feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px;display:none}
#feedback.correct-fb{background:rgba(0,184,148,.15);border:1px solid var(--correct);color:var(--correct)}
#feedback.wrong-fb{background:rgba(214,48,49,.15);border:1px solid var(--wrong);color:var(--wrong)}
#next-btn{margin-top:20px;width:100%;padding:16px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent}
#next-btn:active{opacity:.8}
#end-screen{display:none;text-align:center;padding:20px 0}
#end-screen h2{font-size:24px;margin-bottom:8px}
#end-screen .final-score{font-size:48px;font-weight:700;margin:16px 0}
#end-screen .grade{font-size:22px;margin-bottom:20px}
.grade-s{color:#ffd700}.grade-a{color:var(--correct)}.grade-b{color:#74b9ff}.grade-c{color:#fdcb6e}.grade-f{color:var(--wrong)}
#wrong-review{text-align:left;margin:24px 0}
#wrong-review h3{margin-bottom:12px;font-size:16px;color:var(--accent)}
.wrong-item{background:var(--surface);padding:14px;border-radius:12px;margin-bottom:10px;border-left:4px solid var(--wrong);font-size:14px}
.wrong-item .wi-q{margin-bottom:6px}
.wrong-item .wi-correct{color:var(--correct)}
.end-btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.end-btns button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid #555!important}
#start-msg{text-align:center;padding:40px 16px;color:var(--muted)}
#start-msg p{margin-bottom:10px}
.hidden{display:none!important}

/* Filter modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;-webkit-tap-highlight-color:transparent}
#modal-overlay.show{display:block}
#filter-modal{display:none;position:fixed;bottom:0;left:0;right:0;max-height:85vh;background:var(--surface);border-radius:20px 20px 0 0;z-index:51;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-bot));-webkit-overflow-scrolling:touch}
#filter-modal.show{display:block}
#filter-modal h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
#filter-modal h3:first-child{margin-top:0}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-header h2{font-size:18px;color:var(--accent)}
.modal-close{background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;padding:4px 8px}
.group-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.group-btns button{padding:8px 14px;border:1px solid #555;border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.group-btns button.active{border-color:var(--accent);color:var(--accent)}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:12px}
.lesson-grid label{display:flex;align-items:center;gap:4px;font-size:13px;padding:6px 4px;cursor:pointer}
.lesson-grid input{accent-color:var(--accent);width:16px;height:16px}
.section-checks label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;cursor:pointer}
.section-checks input{accent-color:var(--accent);width:16px;height:16px}
.toggle-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.toggle-row input{accent-color:var(--accent)}
#modal-start{width:100%;padding:14px;margin-top:16px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#modal-wrong{width:100%;padding:12px;margin-top:8px;border:1px solid #555;border-radius:12px;background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.score-history{margin-top:16px;font-size:12px;color:var(--muted)}
.score-history div{padding:3px 0;border-bottom:1px solid #333}
</style>
</head>
<body>
<div id="topbar">
<div>
<div class="title">N2 文法 Quiz</div>
<div class="stats" id="topbar-stats">全26課 — Tap ⚙ to start</div>
</div>
<button class="gear" onclick="toggleModal()" aria-label="Settings">⚙</button>
</div>
<div id="progress-bar-bg"><div id="progress-bar"></div></div>
<div id="modal-overlay" class="show" onclick="toggleModal()"></div>
<div id="filter-modal" class="show">
<div class="modal-header">
<h2>N2 文法 Quiz</h2>
<button class="modal-close" onclick="toggleModal()">&times;</button>
</div>
<h3>Group</h3>
<div class="group-btns" id="group-btns">
<button onclick="selectGroup('all')" class="active">All</button>
<button onclick="selectGroup([1,2,3,4,5])">A 1-5</button>
<button onclick="selectGroup([6,7,8,9,10])">B 6-10</button>
<button onclick="selectGroup([11,12,13,14,15])">C 11-15</button>
<button onclick="selectGroup([16,17,18,19,20])">D 16-20</button>
<button onclick="selectGroup([21,22,23,24,25,26])">E 21-26</button>
</div>
<h3>Lessons</h3>
<div class="lesson-grid" id="lesson-grid"></div>
<h3>Section Type</h3>
<div class="section-checks">
<label><input type="checkbox" checked data-section="drill"> Drill (囲)</label>
<label><input type="checkbox" checked data-section="mixed"> Mixed Review</label>
<label><input type="checkbox" checked data-section="mondai"> 問題</label>
</div>
<div class="toggle-row"><label><input type="checkbox" id="shuffle-toggle" checked> Shuffle</label></div>
<button id="modal-start" onclick="startQuiz();toggleModal()">Start Quiz</button>
<button id="modal-wrong" onclick="startQuiz(true);toggleModal()">Retry Wrong Answers</button>
<div id="score-history" class="score-history"></div>
</div>
<div id="main">
<div id="quiz-area">
<div id="quiz-content" class="hidden">
<span class="grammar-badge" id="grammar-badge"></span>
<span class="section-badge" id="section-badge"></span>
<div id="question-text"></div>
<div class="choices" id="choices"></div>
<div id="feedback"></div>
<button id="next-btn" onclick="nextQuestion()">Next →</button>
</div>
<div id="start-msg">
<p style="font-size:18px">Tap ⚙ to configure and start</p>
<p style="font-size:14px">702 questions across 26 lessons</p>
</div>
</div>
<div id="end-screen">
<h2>Quiz Complete!</h2>
<div class="final-score" id="final-score"></div>
<div class="grade" id="grade"></div>
<div id="wrong-review"></div>
<div class="end-btns">
<button class="btn-primary" onclick="startQuiz()">Retry All</button>
<button class="btn-secondary" onclick="startQuiz(true)">Retry Wrong Only</button>
<button class="btn-secondary" onclick="resetView()">Back</button>
</div>
</div>
</div>
<script src="questions.js"></script>
<script>

let filtered=[],current=0,score=0,answered=false,wrongList=[];
const STORAGE_KEY="n2quiz_all";
function getLessonNums(){return[...new Set(QUESTIONS.map(q=>q.lesson))].sort((a,b)=>a-b)}
function getSectionType(s){if(s==="問題")return"mondai";if(s.match(/^\d+〜\d+$/)||s.match(/^1〜/))return"mixed";return"drill"}
function init(){
const grid=document.getElementById("lesson-grid");
getLessonNums().forEach(n=>{const lbl=document.createElement("label");lbl.innerHTML=`<input type="checkbox" checked data-lesson="${n}">${n}課`;grid.appendChild(lbl)});
loadHistory();
}
function selectGroup(g){
const boxes=document.querySelectorAll("[data-lesson]");
const btns=document.querySelectorAll("#group-btns button");
btns.forEach(b=>b.classList.remove("active"));
if(g==="all"){boxes.forEach(b=>b.checked=true);btns[0].classList.add("active")}
else{boxes.forEach(b=>b.checked=false);g.forEach(n=>{const cb=document.querySelector(`[data-lesson="${n}"]`);if(cb)cb.checked=true});
const idx=g[0]<=5?1:g[0]<=10?2:g[0]<=15?3:g[0]<=20?4:5;btns[idx].classList.add("active")}
}
function getFiltered(){
const lessons=[...document.querySelectorAll("[data-lesson]:checked")].map(e=>+e.dataset.lesson);
const sections=[...document.querySelectorAll("[data-section]:checked")].map(e=>e.dataset.section);
return QUESTIONS.filter(q=>lessons.includes(q.lesson)&&sections.includes(getSectionType(q.section)));
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function toggleModal(){
document.getElementById("modal-overlay").classList.toggle("show");
document.getElementById("filter-modal").classList.toggle("show");
}
function startQuiz(wrongOnly=false){
if(wrongOnly&&wrongList.length>0){filtered=[...wrongList]}
else{filtered=getFiltered()}
if(filtered.length===0){alert("No questions selected.");return}
if(document.getElementById("shuffle-toggle").checked)shuffle(filtered);
current=0;score=0;wrongList=[];answered=false;
document.getElementById("start-msg").classList.add("hidden");
document.getElementById("end-screen").style.display="none";
document.getElementById("quiz-content").classList.remove("hidden");
showQuestion();
}
function showQuestion(){
const q=filtered[current];
document.getElementById("grammar-badge").textContent=q.lesson+"課 "+q.grammar;
document.getElementById("section-badge").textContent=q.section;
document.getElementById("question-text").innerHTML=q.q.replace(/（\s*）/g,'<span class="blank">　　　</span>');
const wrap=document.getElementById("choices");wrap.innerHTML="";
q.c.forEach((c,i)=>{const btn=document.createElement("button");btn.className="choice-btn";
btn.innerHTML=`<span class="num">${i+1}</span><span>${c}</span>`;btn.onclick=()=>pick(i);wrap.appendChild(btn)});
document.getElementById("feedback").style.display="none";document.getElementById("feedback").className="";
document.getElementById("next-btn").style.display="none";answered=false;updateProgress();updateScore();
}
function pick(i){
if(answered)return;answered=true;const q=filtered[current];
const btns=document.querySelectorAll(".choice-btn");const fb=document.getElementById("feedback");
if(i===q.a){score++;btns[i].classList.add("correct");fb.textContent="✓ Correct!";fb.className="correct-fb"}
else{btns[i].classList.add("wrong");btns[q.a].classList.add("reveal-correct");
fb.textContent="✗ → "+(q.a+1)+" "+q.c[q.a];fb.className="wrong-fb";wrongList.push(q)}
fb.style.display="block";document.getElementById("next-btn").style.display="block";updateScore();
}
function nextQuestion(){current++;if(current>=filtered.length){endQuiz();return}showQuestion()}
function updateProgress(){
const pct=filtered.length?((current)/filtered.length*100):0;
document.getElementById("progress-bar").style.width=pct+"%";
document.getElementById("topbar-stats").textContent=(current+1)+"/"+filtered.length+" | Score: "+score;
}
function updateScore(){
document.getElementById("topbar-stats").textContent=(current+1)+"/"+filtered.length+" | Score: "+score+"/"+(current+(answered?1:0));
}
function endQuiz(){
document.getElementById("quiz-content").classList.add("hidden");
const pct=Math.round(score/filtered.length*100);
document.getElementById("final-score").textContent=score+"/"+filtered.length+" ("+pct+"%)";
let g,gc;if(pct>=95){g="S";gc="grade-s"}else if(pct>=85){g="A";gc="grade-a"}
else if(pct>=70){g="B";gc="grade-b"}else if(pct>=50){g="C";gc="grade-c"}else{g="F";gc="grade-f"}
const gel=document.getElementById("grade");gel.textContent="Grade: "+g;gel.className="grade "+gc;
const wr=document.getElementById("wrong-review");
if(wrongList.length){let h="<h3>Review ("+wrongList.length+" wrong)</h3>";
wrongList.forEach(q=>{h+=`<div class="wrong-item"><div class="wi-q">${q.lesson}課 ${q.section}: ${q.q}</div><div class="wi-correct">→ ${q.c[q.a]}</div></div>`});
wr.innerHTML=h}else{wr.innerHTML="<p style='color:var(--correct);font-size:18px;margin:20px 0'>Perfect score!</p>"}
document.getElementById("end-screen").style.display="block";
saveHistory(pct,filtered.length);updateProgress();
}
function saveHistory(pct,total){
const hist=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
hist.push({date:new Date().toLocaleDateString("ja-JP"),pct,total,score});
if(hist.length>20)hist.shift();localStorage.setItem(STORAGE_KEY,JSON.stringify(hist));loadHistory();
}
function loadHistory(){
const hist=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
const el=document.getElementById("score-history");if(!hist.length){el.innerHTML="";return}
el.innerHTML="<h3 style='margin-bottom:6px'>History</h3>"+hist.slice(-5).reverse().map(h=>`<div>${h.date} — ${h.pct}% (${h.total}Q)</div>`).join("");
}
function resetView(){
document.getElementById("end-screen").style.display="none";
document.getElementById("quiz-content").classList.add("hidden");
document.getElementById("start-msg").classList.remove("hidden");
document.getElementById("progress-bar").style.width="0%";
document.getElementById("topbar-stats").textContent="全26課 — Tap ⚙ to start";
}
document.addEventListener("keydown",e=>{
if(!answered&&e.key>="1"&&e.key<="4"){const i=+e.key-1;const btns=document.querySelectorAll(".choice-btn");if(i<btns.length)pick(i)}
if(answered&&(e.key==="Enter"||e.key===" "))nextQuestion();
});
init();
</script>
</body>
</html>
